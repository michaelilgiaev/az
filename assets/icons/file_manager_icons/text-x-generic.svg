<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio text-file icon (theme name text-x-generic, the default look for plain text files
       and any file with no more specific type). Moves off the Thunar/Adwaita look: an Azzio
       cyan-to-blue document sheet with a folded corner and white text lines. Bare (transparent
       background) like the folder set. -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <!-- Sheet body (gradient) with a folded top-right corner. -->
  <path fill="url(#azFolder)" d="M34 20 h44 l20 20 v66 a4 4 0 0 1 -4 4 H34 a4 4 0 0 1 -4 -4 V24 a4 4 0 0 1 4 -4 Z"/>
  <!-- Folded corner (darker). -->
  <path fill="url(#azFolderBack)" d="M78 20 l20 20 H82 a4 4 0 0 1 -4 -4 Z"/>
  <!-- White text lines. -->
  <g fill="#ffffff">
    <rect x="42" y="56" width="44" height="6" rx="3"/>
    <rect x="42" y="70" width="44" height="6" rx="3"/>
    <rect x="42" y="84" width="30" height="6" rx="3"/>
  </g>
</svg>
